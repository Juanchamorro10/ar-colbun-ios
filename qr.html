<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de QR · Estaciones</title>
<script src="lib/qrcode.js"></script>
<style>
  body{font-family:system-ui,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#14292a}
  input{width:100%;padding:10px;font-size:16px;border:1px solid #bcd;border-radius:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;margin-top:20px}
  .q{border:1px solid #cde;border-radius:12px;padding:14px;text-align:center;break-inside:avoid}
  .q svg{width:100%;height:auto}
  .q h3{margin:8px 0 2px;font-size:16px} .q small{color:#567;word-break:break-all}
  @media print{input,p.ayuda{display:none}}
</style>
</head>
<body>
<h1>QR de las 5 estaciones</h1>
<p class="ayuda">Pega la URL donde quedó publicada la página (con https y terminando en /). Imprime esta hoja o guarda cada QR como imagen.</p>
<input id="base" value="https://juanchamorro10.github.io/ar-colbun/">
<div class="grid" id="grid"></div>
<script>
const NOMBRES = ["Estación 1","Estación 2","Estación 3","Los Peces de la Cuenca del Biobío","La Energía del Agua, un Río de Vida"];
const $b = document.getElementById("base"), $g = document.getElementById("grid");
function dibujar(){
  let base = $b.value.trim(); if(base && !base.endsWith("/")) base += "/";
  $g.innerHTML = "";
  NOMBRES.forEach((nombre, i) => {
    const url = base + "?e=" + (i + 1);
    const qr = qrcode(0, "M"); qr.addData(url); qr.make();
    const d = document.createElement("div"); d.className = "q";
    d.innerHTML = qr.createSvgTag({cellSize:6, margin:2, scalable:true}) +
      "<h3>" + (i+1) + ". " + nombre + "</h3><small>" + url + "</small>";
    $g.appendChild(d);
  });
}
$b.addEventListener("input", dibujar); dibujar();
</script>
</body>
</html>
